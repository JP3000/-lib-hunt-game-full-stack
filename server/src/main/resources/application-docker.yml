# Docker 中间件 profile：docker compose 把 MySQL/Redis 映射到 3307/6380，
# 避免与本机已有的 3306/6379 冲突。
#
# 用法：
#   SPRING_PROFILES_ACTIVE=docker ./mvnw spring-boot:run
# 或在 IDEA 运行配置的 environment variables 里加：
#   SPRING_PROFILES_ACTIVE=docker
spring:
  datasource:
    url: "jdbc:mysql://localhost:3307/libhunt?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
  data:
    redis:
      port: 6380
